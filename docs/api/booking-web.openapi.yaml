openapi: 3.1.0
info:
  title: Barbershop public booking web contract
  version: 1.0.0
  description: >-
    HTTP contract for the public booking flow. The current client is an HTML
    form, so successful mutations redirect to an HTML page instead of returning
    JSON. This contract does not expose sequential database identifiers.
servers:
  - url: /
paths:
  /api/v1/services:
    get:
      operationId: listApiServices
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [women, men]
      responses:
        '200':
          description: Active services, optionally filtered by category.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiService'
        '422':
          description: Category is invalid.
  /api/v1/availability:
    get:
      operationId: listAvailableSlots
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Available hourly booking slots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '404':
          description: Service does not exist or is not available for booking.
        '422':
          description: Date is not a valid ISO 8601 date.
  /api/v1/bookings:
    post:
      operationId: createApiBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBookingRequest'
      responses:
        '201':
          description: Booking confirmed immediately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBooking'
        '404':
          description: Service does not exist or is not available for booking.
        '422':
          description: Invalid input or unavailable time slot.
  /api/v1/bookings/{public_token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      operationId: showApiBooking
      responses:
        '200':
          description: Booking details without client contact data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBooking'
        '404':
          description: Token is unknown.
    delete:
      operationId: cancelApiBooking
      responses:
        '200':
          description: Booking cancelled without deleting its history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBooking'
        '404':
          description: Token is unknown.
    patch:
      operationId: rescheduleApiBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking]
              properties:
                booking:
                  type: object
                  required: [starts_at]
                  properties:
                    starts_at:
                      type: string
                      format: date-time
      responses:
        '201':
          description: New booking confirmed; old booking is annulled atomically.
        '404':
          description: Token is unknown.
        '422':
          description: New slot is unavailable; old booking remains confirmed.
  /bookings/new:
    get:
      operationId: showBookingForm
      parameters:
        - $ref: '#/components/parameters/ServiceId'
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Booking form with currently available slots.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Service does not exist or is not available for booking.
  /bookings:
    post:
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingForm'
      responses:
        '302':
          description: Booking confirmed; Location contains the public token URL.
          headers:
            Location:
              schema:
                type: string
                pattern: '^/bookings/[A-Za-z0-9_-]+$'
        '422':
          description: Invalid input or unavailable time slot.
  /bookings/{public_token}:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      operationId: showBooking
      responses:
        '200':
          description: Booking details page.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Token is unknown.
  /bookings/{public_token}/cancel:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    post:
      operationId: cancelBooking
      responses:
        '302':
          description: Booking was cancelled; Location contains the same public token URL.
        '404':
          description: Token is unknown.
  /bookings/{public_token}/reschedule:
    parameters:
      - $ref: '#/components/parameters/PublicToken'
    get:
      operationId: showRescheduleForm
      responses:
        '200':
          description: Rescheduling form.
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Token is unknown.
    post:
      operationId: rescheduleBooking
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [date, starts_at]
              properties:
                date:
                  type: string
                  format: date
                starts_at:
                  type: string
                  format: date-time
      responses:
        '302':
          description: New booking confirmed; old booking is annulled atomically.
        '422':
          description: New slot is unavailable; old booking remains confirmed.
        '404':
          description: Token is unknown.
components:
  parameters:
    ServiceId:
      name: service_id
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
    Date:
      name: date
      in: query
      required: true
      schema:
        type: string
        format: date
    PublicToken:
      name: public_token
      in: path
      required: true
      schema:
        type: string
        minLength: 32
  schemas:
    ApiService:
      type: object
      required: [id, name, category, duration_minutes, price_from_cents, price_to_cents]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [women, men]
        duration_minutes:
          type: integer
        price_from_cents:
          type: integer
        price_to_cents:
          type: integer
    Availability:
      type: object
      required: [service_id, date, slots]
      properties:
        service_id:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            type: string
            format: date-time
    ApiBookingRequest:
      type: object
      required: [service_id, booking]
      properties:
        service_id:
          type: integer
          minimum: 1
        booking:
          type: object
          required: [starts_at, client_name, phone_number]
          properties:
            starts_at:
              type: string
              format: date-time
            client_name:
              type: string
              minLength: 1
            phone_number:
              type: string
              pattern: '^8-[0-9]{3}-[0-9]{3}-[0-9]{2}-[0-9]{2}$'
    ApiBooking:
      type: object
      required: [public_token, status, service_id, starts_at]
      properties:
        public_token:
          type: string
          minLength: 32
        status:
          type: string
          enum: [confirmed]
        service_id:
          type: integer
          minimum: 1
        starts_at:
          type: string
          format: date-time
    BookingForm:
      type: object
      required: [service_id, date, booking]
      properties:
        service_id:
          type: integer
          minimum: 1
        date:
          type: string
          format: date
        booking:
          type: object
          required: [starts_at, client_name, phone_number]
          properties:
            starts_at:
              type: string
              format: date-time
            client_name:
              type: string
              minLength: 1
            phone_number:
              type: string
              pattern: '^8-[0-9]{3}-[0-9]{3}-[0-9]{2}-[0-9]{2}$'
